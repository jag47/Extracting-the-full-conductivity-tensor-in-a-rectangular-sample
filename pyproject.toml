[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rectcond"
version = "0.1.0"
description = "Extract the full 2D conductivity tensor (anisotropic principal conductivities, Hall conductivity, and principal-axes angle) from four resistance measurements on a rectangular sample"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Julia Gelfond" },
    { name = "Oskar Vafek" },
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "mpmath>=1.3",
]

[project.urls]
arXiv = "https://arxiv.org/abs/2608.06643"
Source = "https://github.com/jag47/Extracting-the-full-conductivity-tensor-in-a-rectangular-sample"

[project.optional-dependencies]
test = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/rectcond"]
